<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أحمد صلاح لصيانة البلايستيشن</title>
  <meta name="description" content="أحمد صلاح لصيانة أجهزة البلايستيشن PS4 و PS5">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      background:#05070d;
      color:#fff;
      font-family:Tahoma,Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .page{
      width:min(1100px,100%);
      text-align:center;
    }
    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid #168cff;
      border-radius:20px;
      box-shadow:0 0 35px rgba(0,132,255,.35);
      background:#05070d;
    }
    .hero img{
      display:block;
      width:100%;
      height:auto;
    }
    .actions{
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
      margin-top:20px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:220px;
      padding:14px 24px;
      border-radius:12px;
      text-decoration:none;
      font-size:18px;
      font-weight:bold;
      transition:.2s;
    }
    .whatsapp{background:#25d366;color:#fff;box-shadow:0 0 20px rgba(37,211,102,.25)}
    .call{background:#087cff;color:#fff;box-shadow:0 0 20px rgba(8,124,255,.25)}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .phone{margin-top:12px;color:#a9cfff;font-size:15px}
    footer{margin-top:18px;color:#71809a;font-size:13px}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <img src="banner.png" alt="أحمد صلاح لصيانة البلايستيشن">
    </section>

    <div class="actions">
      <a class="btn whatsapp" href="https://wa.me/201153868462" target="_blank" rel="noopener">
        💬 تواصل معنا على واتساب
      </a>
      <a class="btn call" href="tel:01153868462">
        📞 اتصل بنا
      </a>
    </div>

    <div class="phone">01153868462</div>
    <footer>أحمد صلاح لصيانة البلايستيشن — PS4 & PS5</footer>
  </main>
</body>
</html>
